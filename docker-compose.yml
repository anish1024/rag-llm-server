services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama-pi5
    ports:
      - 11434:11434
    volumes:
      - ollama-data:/root/.ollama
    restart: unless-stopped

  qdrant:
    image: y0mg/qdrant-raspberry-pi:latest
    container_name: qdrant-pi5
    ports:
      - 6333:6333
    volumes:
      - /home/ssd/ragdata/qdrantdb:/qdrant/storage
    restart: unless-stopped

  rag-agents:
    build:
      context: .
      dockerfile: Dockerfile.rag-agents
    container_name: rag-agents-pi5
    ports:
      - 8000:8000
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - LLM_MODEL=qwen2.5:3b-instruct-q4_K_M
      - EMBEDDING_MODEL=nomic-embed-text
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_COLLECTION=rag_docs
      - WIKIJS_URL=${WIKIJS_URL:-}
      - WIKIJS_API_KEY=${WIKIJS_API_KEY:-}
    depends_on:
      - ollama
      - qdrant
    restart: unless-stopped

  webui-pi5:
    image: ghcr.io/open-webui/open-webui:main
    container_name: webui-pi5
    ports:
      - 3000:8080
    volumes:
      - open-webui:/app/backend/data
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
    depends_on:
      - ollama
    restart: unless-stopped

  qdrant-test:
    build:
      context: .
      dockerfile: Dockerfile.qdrant-test
    depends_on:
      - qdrant
      - ollama
    environment:
      QDRANT_URL: http://qdrant-pi5:6333
      OLLAMA_BASE_URL: http://ollama-pi5:11434
      EMBEDDING_MODEL: nomic-embed-text
      QDRANT_COLLECTION: test_rag_docs
    profiles:
      - test

  rag-tool-server:
    build:
      context: .
      dockerfile: Dockerfile.rag-agents
    container_name: rag-tool-server
    command: uvicorn tool_server:app --host 0.0.0.0 --port 9000
    ports:
      - "9000:9000"
    environment:
      - RAG_URL=http://rag-agents:8000/rag
    depends_on:
      - rag-agents
    restart: unless-stopped

  telegram-gateway:
    build:
      context: .
      dockerfile: Dockerfile.telegram-gateway
    container_name: telegram-gateway
    restart: unless-stopped
    environment:
      TELEGRAM_BOT_TOKEN: "8567730868:AAEqAoyoXFFXGJvUilDRGiJk9CJ1xC1BiZU"
      WEBHOOK_SECRET: "anibot"
      RAG_CHAT_URL: "http://rag-agents:8000/rag"
      RAG_IMPORT_URL: "http://rag-tool-server:9000/import"
    ports:
      - "8080:8080"
    volumes:
      - ./ebooks:/data/uploads       # shared storage for docs/images
    depends_on:
      - rag-agents
      - rag-tool-server

  wiki-sync:
    image: curlimages/curl:latest
    container_name: wiki-sync
    environment:
      - WIKI_SYNC_INTERVAL_MINUTES=${WIKI_SYNC_INTERVAL_MINUTES:-60}
    entrypoint: >
      sh -c "INTERVAL=$${WIKI_SYNC_INTERVAL_MINUTES:-60};
        SLEEP=$$((INTERVAL * 60));
        while true; do
          echo \"[wiki-sync] ingesting pages updated in last $${INTERVAL} minutes...\";
          curl -sf -X POST http://rag-agents:8000/ingest/wiki
            -H 'Content-Type: application/json'
            -d \"{\\\"since_minutes\\\": $${INTERVAL}}\" || echo '[wiki-sync] ingest failed';
          sleep $$SLEEP;
        done"
    depends_on:
      - rag-agents
    restart: unless-stopped

  # --- NEW OPENCLAW DEPLOYMENT BLOCK ---
  openclaw-gateway:
    image: openclaw/gateway:latest
    container_name: openclaw-pi5
    ports:
      - 18789:18789  # Exposes the local OpenClaw control management UI
    volumes:
      # Persistent tracking for configs, secrets, paired tokens, and playbooks
      - /home/ssd/openclaw:/root/.openclaw
      
      # Exposes your project repositories to the agent shell framework
      - /home/ssd/projects:/home/pi/projects
      
      # CRUCIAL: Links host engine to spawn isolated testing/staging preview sidecars
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - NODE_ENV=production
    deploy:
      resources:
        limits:
          memory: 4G  # Allocation ceiling to secure host system resource stability
    restart: unless-stopped

volumes:
  ollama-data: {}     # ← Declared here!
  open-webui: {}      # ← Declared here!
