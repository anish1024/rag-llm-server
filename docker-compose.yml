services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama-pi5
    ports:
      - 11434:11434
    volumes:
      - ollama-data:/root/.ollama
    restart: unless-stopped

  qdrant:
    image: y0mg/qdrant-raspberry-pi:latest
    container_name: qdrant-pi5
    ports:
      - 6333:6333
    volumes:
      - /home/ssd/ragdata/qdrantdb:/qdrant/storage
    restart: unless-stopped

  rag-agents:
    build:
      context: .
      dockerfile: Dockerfile.rag-agents
    container_name: rag-agents-pi5
    ports:
      - 8000:8000
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - LLM_MODEL=qwen2.5:3b-instruct-q4_K_M
      - EMBEDDING_MODEL=nomic-embed-text
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_COLLECTION=rag_docs
    depends_on:
      - ollama
      - qdrant
    restart: unless-stopped

  webui-pi5:
    image: ghcr.io/open-webui/open-webui:main
    container_name: webui-pi5
    ports:
      - 3000:8080
    volumes:
      - open-webui:/app/backend/data
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
    depends_on:
      - ollama
    restart: unless-stopped

  qdrant-test:
    build:
      context: .
      dockerfile: Dockerfile.qdrant-test
    depends_on:
      - qdrant
      - ollama
    environment:
      QDRANT_URL: http://qdrant-pi5:6333
      OLLAMA_BASE_URL: http://ollama-pi5:11434
      EMBEDDING_MODEL: nomic-embed-text
      QDRANT_COLLECTION: test_rag_docs
    profiles:
      - test

volumes:
  ollama-data: {}     # ← Declared here!
  open-webui: {}      # ← Declared here!
